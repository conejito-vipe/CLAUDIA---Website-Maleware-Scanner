name: Release
# Nur auf Knopfdruck (Actions > Release > Run workflow). Baut alles und legt direkt den GitHub-Release an:
#   - CLAUDIA_v<Version>.zip            Paket der Python-Fassung (die Aktualisierung im Programm lädt genau diese Datei)
#   - CLAUDIA-Setup-<Version>.exe       Windows-Installer, einzelne Datei, ohne Python
#   - CLAUDIA_v<Version>_Windows.zip    Windows, tragbarer Ordner mit CLAUDIA.exe
#   - CLAUDIA_v<Version>_Mac.zip        Mac-Programm CLAUDIA.app (Apple Silicon), ohne Python
#   - SHA256SUMS.txt                    Prüfsummen aller Dateien (plus Zeile "SHA-256: ..." im Text für die Aktualisierung im Programm)
# Der Text des Releases ist RELEASE_NOTES.md (Englisch, Deutsch als Block zum Umschalten). Das Tag v<Version> kommt aus claudia/__init__.py.
# Das Repository ist öffentlich: die Rechner kosten kein Freikontingent. Die Tests laufen vorher (Linux).
# Ohne Häkchen entsteht ein normales, sofort öffentliches Release.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Nur als Entwurf anlegen (nicht öffentlich, zum Prüfen). Leer lassen = sofort öffentliches Release"
        type: boolean
        default: false
      prerelease:
        description: "Als Vorabversion markieren. Leer lassen = normales Release"
        type: boolean
        default: false
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow
      - name: Tests (Linux, alle)
        working-directory: tests
        env: { PYTHONPATH: "fake_paramiko:.." }
        run: python -W ignore -m unittest discover -s . -p "test_*.py"

  package:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: v
        run: echo "version=$(python -c 'from claudia import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Paket bauen (CHANGELOG, RELEASE_NOTES, Prüfsummen, ZIP)
        run: |
          mkdir -p dist
          python tools/build_release.py dist
          test -f "dist/CLAUDIA_v${{ steps.v.outputs.version }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: |
            dist/CLAUDIA_v*.zip
            RELEASE_NOTES.md
          if-no-files-found: error

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "pyinstaller>=6.10" "paramiko>=3.4" "cryptography>=41" "pywebview>=5.0"
      - name: Programmdatei bauen (PyInstaller)
        run: python tools/build_exe.py dist-exe
      - name: Selbsttest der gebauten Programmdatei
        run: |
          $env:CLAUDIA_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "dist-exe\_work\dist\CLAUDIA\CLAUDIA.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Code $($p.ExitCode))" }
      - name: Installer bauen (Inno Setup, einzelne Datei)
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "from claudia import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DFrozenApp=1" installer\claudia.iss
          if (-not (Test-Path "installer\Output\CLAUDIA-Setup-$v.exe")) { throw "Installer fehlt" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            dist-exe/CLAUDIA_v*_Windows.zip
            installer/Output/CLAUDIA-Setup-*.exe
          if-no-files-found: error

  mac:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "pyinstaller>=6.10" "paramiko>=3.4" "cryptography>=41" "pywebview>=5.0"
      - name: Mac-Programm bauen (PyInstaller)
        run: python tools/build_exe.py dist-exe
      - name: Selbsttest der gebauten Programmdatei
        run: |
          CLAUDIA_SELFTEST_OUT="$PWD/selftest.txt" dist-exe/_work/dist/CLAUDIA.app/Contents/MacOS/CLAUDIA --selftest || { cat selftest.txt; exit 1; }
          cat selftest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          path: dist-exe/CLAUDIA_v*_Mac.zip
          if-no-files-found: error

  release:
    needs: [package, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.package.outputs.version }}
      DRAFT: ${{ inputs.draft }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Dateien sammeln, Prüfsummen und Release-Text erzeugen
        run: |
          mkdir -p files
          find artifacts -type f \( -name 'CLAUDIA_v*.zip' -o -name 'CLAUDIA-Setup-*.exe' \) -exec cp {} files/ \;
          cp artifacts/package/RELEASE_NOTES.md RELEASE_NOTES.md
          python tools/release_body.py files --notes RELEASE_NOTES.md --out release_body.md
          ls -l files
          cat files/SHA256SUMS.txt
      - name: Release anlegen (oder Dateien eines vorhandenen Tags ersetzen)
        run: |
          tag="v${VERSION}"
          flags=()
          [ "$DRAFT" = "true" ] && flags+=(--draft)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag besteht schon: Dateien werden ersetzt, Text wird aktualisiert."
            gh release upload "$tag" files/* --clobber
            gh release edit "$tag" --title "CLAUDIA ${VERSION}" --notes-file release_body.md
          else
            gh release create "$tag" files/* --target "$GITHUB_SHA" --title "CLAUDIA ${VERSION}" --notes-file release_body.md "${flags[@]}"
          fi
