name: Windows-Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release-Paket entpacken
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python tools/build_release.py dist
          Expand-Archive -Path (Get-ChildItem dist\CLAUDIA_v*.zip | Select-Object -First 1).FullName -DestinationPath dist
      - name: Installer bauen (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "from claudia import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\claudia.iss
      - name: Prüfsumme
        run: Get-FileHash installer\Output\*.exe -Algorithm SHA256 | Format-List | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: CLAUDIA-Setup
          path: installer/Output/*.exe
