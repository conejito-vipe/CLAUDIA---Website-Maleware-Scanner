name: CI
# Läuft bei jedem Push auf main, bei Pull Requests und auf Knopfdruck (Actions > CI > Run workflow).
# Das Repository ist öffentlich: Standard-Rechner (Linux, Windows, macOS) kosten kein Freikontingent.
# Commits nur mit Dokumentation oder Prüfsummen: "[skip ci]" in den Commit-Text schreiben, dann läuft die CI nicht.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Linux: ganze Testsuite. Die Tests bauen einen Linux-Server nach (sh, stat, sha256sum ...),
  # weil CLAUDIA dem Webserver Linux-Befehle schickt. Python 3.9 gibt es nicht auf ubuntu-latest (26.04); 24.04 hat PHP 8.3.
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9", browser: false }
          - { os: ubuntu-latest, python: "3.13", browser: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip pillow "cryptography>=41" hypothesis
      - name: Browser for UI tests (nur Python 3.13; unter 3.9 werden die Browser-Tests übersprungen)
        if: matrix.browser
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
        continue-on-error: true
      - name: Tests (Linux, alle)
        working-directory: tests
        env: { PYTHONPATH: "fake_paramiko:..", CLAUDIA_SITE_PAUSE: "0" }
        run: python -W ignore -m unittest discover -s . -p "test_*.py"
  # Windows: nur die Tests, die Windows-Seite und plattformunabhängige Teile prüfen
  # (Start, Fenster, Deinstallation, Icons, Berichte, Doku). Liste: tests/windows_tests.txt
  test-windows:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip pillow "cryptography>=41" hypothesis
      - name: Tests (Windows, Auswahl)
        shell: bash
        working-directory: tests
        env: { PYTHONPATH: "fake_paramiko;..", CLAUDIA_SITE_PAUSE: "0" }
        run: python -W ignore -m unittest $(tr -d '\r' < windows_tests.txt)
  # macOS: nur die Tests, die Mac-Seite und plattformunabhängige Teile prüfen (Startdatei unter bash 3.2, Speicherorte, Fenster, Paket).
  # Liste: tests/mac_tests.txt. Nur diese Auswahl, weil die übrigen Tests einen Linux-Server nachbauen.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip pillow "cryptography>=41" hypothesis
      - name: Tests (Mac, Auswahl)
        working-directory: tests
        env: { PYTHONPATH: "fake_paramiko:..", CLAUDIA_SITE_PAUSE: "0" }
        run: python -W ignore -m unittest $(tr -d '\r' < mac_tests.txt)
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: python tools/i18n.py check
      - run: python tools/build_docs.py dist-doc.html
