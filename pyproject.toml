[project]
name = "claudia-security-check"
version = "2.18.0"
description = "Read-only security check for Joomla and WordPress sites over SSH, with a local web interface (DE/EN)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["paramiko>=3.4", "cryptography>=41"]
license = { file = "LICENSE" }
keywords = ["joomla", "wordpress", "security", "ssh", "malware", "scanner"]
classifiers = [
  "Environment :: Web Environment",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
claudia = "claudia.__main__:main"

[tool.setuptools]
packages = ["claudia", "claudia.checks"]

[tool.setuptools.package-data]
claudia = ["web/*", "lang/*.json", "docs/*.txt", "*.json", "assets/*"]
